name: Build and Attach Release Executable

on:
  release:
    types: [published] # Triggers automatically when you hit "Publish Release" on GitHub

permissions:
  contents: write

jobs:
  build-multiplatform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Spins up three independent cloud servers to compile all versions at once
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    # Compiles natively depending on the operating system matrix runner
    - name: Build Standalone Application
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          pyinstaller --onefile --windowed --name="StreamDeck2027" --collect-all resvg-py --collect-submodules StreamDeck --hidden-import ntcore --add-data "assets/fonts;assets/fonts" --add-data "assets/images;assets/images" --add-binary "assets/dlls;assets/dlls" src/main.py
        else
          pyinstaller --onefile --windowed --name="StreamDeck2027" --collect-all resvg-py --collect-submodules StreamDeck --hidden-import ntcore --add-data "assets/fonts:assets/fonts" --add-data "assets/images:assets/images" src/main.py
        fi

    - name: Upload Executable to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/StreamDeck2027.exe
          dist/StreamDeck2027
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
