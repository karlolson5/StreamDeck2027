name: Build and Attach Release Executable

on:
  release:
    types: [published] # Triggers automatically when you hit "Publish Release" on GitHub

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compile Executable with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name="StreamDeck2027" `
        --collect-all resvg-py `
        --collect-submodules StreamDeck `
        --hidden-import ntcore `
        --add-data "assets/fonts;assets/fonts" `
        --add-data "assets/images;assets/images" `
        --add-binary "assets/dlls;assets/dlls" `
        src/main.py

    - name: Upload Executable to GitHub Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: dist/StreamDeck2027.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub, no setup needed
