name: Build and Attach Release Executable

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-multiplatform:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Standalone Application
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          # Windows Compilation
          pyinstaller --onefile --windowed --name="StreamDeck2027-Windows" \
          --paths=src \
          --collect-all resvg-py --collect-submodules StreamDeck --hidden-import ntcore \
          --add-data "assets/fonts;assets/fonts" \
          --add-data "assets/images;assets/images" \
          --add-binary "assets/dlls;assets/dlls" src/main.py
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          # Mac Compilation
          pyinstaller --onefile --windowed --name="StreamDeck2027-Mac" \
          --paths=src \
          --collect-all resvg-py --collect-submodules StreamDeck --hidden-import ntcore \
          --add-data "assets/fonts:assets/fonts" \
          --add-data "assets/images:assets/images" src/main.py
        else
          # Linux Compilation
          pyinstaller --onefile --windowed --name="StreamDeck2027-Linux" \
          --paths=src \
          --collect-all resvg-py --collect-submodules StreamDeck --hidden-import ntcore \
          --add-data "assets/fonts:assets/fonts" \
          --add-data "assets/images:assets/images" src/main.py
        fi

    - name: Archive Unix Binaries
      shell: bash
      run: |
        cd dist
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          tar -czf StreamDeck2027-Mac.tar.gz StreamDeck2027-Mac
        elif [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          tar -czf StreamDeck2027-Linux.tar.gz StreamDeck2027-Linux
        fi

    - name: Upload Assets to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/StreamDeck2027-Windows.exe
          dist/StreamDeck2027-Mac.tar.gz
          dist/StreamDeck2027-Linux.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
